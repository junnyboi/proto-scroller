name: Godot verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      GODOT_SILENCE_ROOT_WARNING: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install native verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq unzip xvfb xauth
          python3 -m pip install --user --break-system-packages gdtoolkit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Godot engine and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/proto-scroller-godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-linux-web-v1

      - name: Restore checksum-verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/proto-scroller-godot"
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ENGINE_ARCHIVE="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          RELEASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p "$CACHE"
          curl -fL --retry 4 --retry-all-errors \
            -o "$CACHE/SHA512-SUMS.txt" "$RELEASE_URL/SHA512-SUMS.txt"
          if [[ ! -s "$CACHE/$ENGINE_ARCHIVE" ]]; then
            curl -fL --retry 4 --retry-all-errors \
              -o "$CACHE/$ENGINE_ARCHIVE" "$RELEASE_URL/$ENGINE_ARCHIVE"
          fi
          (
            cd "$CACHE"
            grep "  $ENGINE_ARCHIVE$" SHA512-SUMS.txt | sha512sum -c -
          )
          rm -rf "$CACHE/engine"
          mkdir -p "$CACHE/engine"
          unzip -q "$CACHE/$ENGINE_ARCHIVE" -d "$CACHE/engine"
          sudo install -m 0755 \
            "$CACHE/engine/Godot_v${GODOT_RELEASE}_linux.x86_64" \
            /usr/local/bin/godot
          if [[ ! -s "$TEMPLATES/web_nothreads_release.zip" ]]; then
            if [[ ! -s "$CACHE/$TEMPLATE_ARCHIVE" ]]; then
              curl -fL --retry 4 --retry-all-errors \
                -o "$CACHE/$TEMPLATE_ARCHIVE" "$RELEASE_URL/$TEMPLATE_ARCHIVE"
            fi
            (
              cd "$CACHE"
              grep "  $TEMPLATE_ARCHIVE$" SHA512-SUMS.txt | sha512sum -c -
            )
            rm -rf "$CACHE/template-stage"
            mkdir -p "$CACHE/template-stage"
            unzip -q "$CACHE/$TEMPLATE_ARCHIVE" -d "$CACHE/template-stage"
            rm -rf "$TEMPLATES"
            mkdir -p "$(dirname "$TEMPLATES")"
            mv "$CACHE/template-stage/templates" "$TEMPLATES"
            rm -f "$CACHE/$TEMPLATE_ARCHIVE"
          fi
          godot --version | grep -F "${GODOT_VERSION}.stable"
          test -s "$TEMPLATES/web_nothreads_debug.zip"
          test -s "$TEMPLATES/web_nothreads_release.zip"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Run complete Godot and browser gate
        working-directory: game
        run: ./verify.sh --full

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-verification-${{ github.run_id }}
          path: game/artifacts
          if-no-files-found: error
          retention-days: 14
